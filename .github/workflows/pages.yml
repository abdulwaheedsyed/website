# Builds and deploys sawaheed.com.
#
# The site itself is built with Jekyll exactly as GitHub's classic Pages
# build did. The LastOne! game (https://sawaheed.com/lastone/) is added from
# the `web-build` branch of the private LastOne repo, fetched with a
# read-only deploy key (secret LASTONE_DEPLOY_KEY). LastOne's CI bumps
# lastone/VERSION here after each build, which triggers this workflow.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add the LastOne! game
        env:
          LASTONE_DEPLOY_KEY: ${{ secrets.LASTONE_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LASTONE_DEPLOY_KEY" > ~/.ssh/lastone && chmod 600 ~/.ssh/lastone
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/lastone -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          if git clone -q --depth 1 -b web-build git@github.com:abdulwaheedsyed/LastOne.git /tmp/lastone; then
            rm -rf /tmp/lastone/.git
            sudo rm -rf _site/lastone
            sudo mkdir -p _site/lastone
            sudo cp -r /tmp/lastone/. _site/lastone/
            echo "LastOne build $(cat /tmp/lastone/VERSION) added"
          else
            echo "::warning::Could not fetch the LastOne web build; deploying the site without it"
          fi

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
